<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkShort</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="glass-container">
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                <span>LinkShort</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active">Home</a>
            </div>
        </nav>

        <main class="main-content">
            <div class="hero-section">
                <h1 class="title-animate">Shorten Your Links <br> <span class="gradient-text">Expand Your Reach</span>
                </h1>
                <p class="subtitle-animate">Transform long, ugly URLs into short, memorable links in seconds.</p>
            </div>

            <div class="input-section fade-in-up">
                <div class="input-wrapper">
                    <i class="fas fa-link input-icon"></i>
                    <input type="url" id="urlInput" placeholder="Paste your long URL here..." autocomplete="off">
                </div>

                <div class="options-wrapper">
                    <div class="input-wrapper small">
                        <i class="fas fa-tag input-icon"></i>
                        <input type="text" id="customSlug" placeholder="Alias (Optional)" autocomplete="off">
                    </div>
                    <button id="shortenBtn" class="glow-button">
                        <span>Shorten Now</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <div id="result" class="result-container hidden">
            </div>
        </main>

        <footer>
            <p>&copy; 2025 Muhmd Samy.</p>
        </footer>
    </div>

    <div id="notification" class="notification"></div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>


</html>
