<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener - Make Links Shorter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-link"></i>
                <span>URL Shortener</span>
            </div>
            <div class="nav-actions">
                <div class="theme-toggle">
                    <i class="fas fa-moon"></i>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <div class="hero-section">
                <h1>Shorten Your Links</h1>
                <p>Make your long URLs shorter and more manageable</p>
            </div>

            <div class="url-form-container">
                <div class="url-form">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-link input-icon"></i>
                            <input type="url" id="urlInput" placeholder="Paste your long URL here..." required>
                        </div>
                        <button id="shortenBtn" class="primary-btn">
                            <i class="fas fa-magic"></i>
                            <span>Shorten</span>
                        </button>
                    </div>
                    <div class="custom-url-section">
                        <div class="input-wrapper">
                            <i class="fas fa-tag input-icon"></i>
                            <input type="text" id="customSlug" placeholder="Custom alias (optional)">
                        </div>
                    </div>
                </div>

                <div id="result" class="result-container">
                </div>
            </div>

            <div class="features-section">
                <div class="feature-card">
                    <i class="fas fa-bolt"></i>
                    <h3>Fast & Reliable</h3>
                    <p>Instant URL shortening with 99.9% uptime</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-shield-alt"></i>
                    <h3>Secure</h3>
                    <p>Your URLs are encrypted and secure</p>
                </div>
                <div class="feature-card">
                    <i class="fas fa-qrcode"></i>
                    <h3>QR Codes</h3>
                    <p>Generate QR codes for your links</p>
                </div>
            </div>

            <div class="history-section">
                <div class="section-header">
                    <h2><i class="fas fa-history"></i> Recent URLs</h2>
                    <div class="history-actions">
                        <button id="clearHistory" class="clear-btn">
                            <i class="fas fa-trash"></i>
                            Clear History
                        </button>
                    </div>
                </div>
                <div id="urlHistory" class="url-history">
                </div>
            </div>
        </main>
    </div>

    <div id="notification" class="notification">
        <span id="notificationText"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
